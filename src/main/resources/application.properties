# URL do banco (altere host, port, database)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/femass-requerimento
quarkus.datasource.username=postgres
quarkus.datasource.password=femass-requerimento

quarkus.hibernate-orm.log.sql=true
quarkus.hibernate-orm.log.format-sql=true

# CORS (dev local front-end)
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:5173
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=authorization,content-type,accept,origin
quarkus.http.cors.exposed-headers=authorization,location,content-type,accept
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=true

quarkus.hibernate-orm.schema-management.strategy=update
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create


# OIDC / Keycloak
# Em execucao local, o Keycloak e publicado pelo Docker Compose na porta 8130.
# Dentro do Compose, QUARKUS_OIDC_AUTH_SERVER_URL aponta para keycloak:8080.
quarkus.oidc.auth-server-url=http://localhost:8130/realms/femass
quarkus.oidc.client-id=backend-service
quarkus.oidc.application-type=service
quarkus.oidc.token.issuer=http://localhost:8130/realms/femass
quarkus.oidc.token.audience=backend-service
quarkus.oidc.roles.role-claim-path=realm_access/roles
quarkus.oidc.connection-delay=20S

# Os testes unitarios atuais nao dependem de um provedor OIDC externo.
%test.quarkus.oidc.enabled=false
quarkus.datasource.devservices.enabled=false

# MinIO
minio.endpoint=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin123
minio.bucket=documentos
documentos.max-size=10485760
quarkus.http.limits.max-body-size=11M
quarkus.http.limits.max-form-attribute-size=10M

# Dev logging: be more verbose for troubleshooting
quarkus.log.level=INFO
quarkus.log.category."org.petrohub".level=INFO
quarkus.log.category."io.quarkus.scheduler".level=DEBUG
quarkus.log.category."io.quarkus.oidc".level=DEBUG

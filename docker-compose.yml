services:
  postgres:
    image: postgres:16
    container_name: femass-requerimento-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: femass-requerimento
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: femass-requerimento
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

    volumes:
      - femass-requerimento-data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: femass-requerimento-keycloak
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN_USERNAME:-admin}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:-admin}"
      KC_HOSTNAME: "${KEYCLOAK_PUBLIC_URL:-http://localhost:8130}"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8130:8080"
    volumes:
      - ./keycloak/realm-femass.json:/opt/keycloak/data/import/realm-femass.json:ro
      - femass-keycloak-data:/opt/keycloak/data


  minio:
    image: quay.io/minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data

  backend:
    container_name: femass-requerimento-backend
    build:
      context: .
      dockerfile: src/main/docker/Dockerfile.jvm
    environment:
      # Quarkus HTTP
      QUARKUS_HTTP_PORT: "${QUARKUS_HTTP_PORT:-8080}"

      # DB (Postgres) - defaults assume compose service 'postgres'
      QUARKUS_DATASOURCE_JDBC_URL: "${QUARKUS_DATASOURCE_JDBC_URL:-jdbc:postgresql://postgres:5432/femass-requerimento}"
      QUARKUS_DATASOURCE_USERNAME: "${QUARKUS_DATASOURCE_USERNAME:-postgres}"
      QUARKUS_DATASOURCE_PASSWORD: "${QUARKUS_DATASOURCE_PASSWORD:-femass-requerimento}"

      # MP Rest client for match-relevancia (maps to quarkus.rest-client.match-relevancia.url)
      QUARKUS_REST_CLIENT_MATCH_RELEVANCIA_URL: "${QUARKUS_REST_CLIENT_MATCH_RELEVANCIA_URL:-https://y1ww0xpk1g.execute-api.us-east-1.amazonaws.com}"

      # OIDC (Keycloak) - valida tokens emitidos para a API
      QUARKUS_OIDC_AUTH_SERVER_URL: "${QUARKUS_OIDC_AUTH_SERVER_URL:-http://keycloak:8080/realms/femass}"
      QUARKUS_OIDC_CLIENT_ID: "${QUARKUS_OIDC_CLIENT_ID:-backend-service}"
      QUARKUS_OIDC_TOKEN_ISSUER: "${QUARKUS_OIDC_TOKEN_ISSUER:-http://localhost:8130/realms/femass}"
      QUARKUS_OIDC_TOKEN_AUDIENCE: "${QUARKUS_OIDC_TOKEN_AUDIENCE:-backend-service}"

      # MinIO
      MINIO_ENDPOINT: "${MINIO_ENDPOINT:-http://minio:9000}"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minioadmin123}"
      MINIO_BUCKET: "${MINIO_BUCKET:-documentos}"

      # CORS (optional) - defaults to local frontend origin; set QUARKUS_HTTP_CORS_ORIGINS to override
      QUARKUS_HTTP_CORS: "${QUARKUS_HTTP_CORS:-true}"
      QUARKUS_HTTP_CORS_ORIGINS: "${QUARKUS_HTTP_CORS_ORIGINS:-http://localhost:5173}"

    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      minio:
        condition: service_started

volumes:
  femass-requerimento-data:
  femass-keycloak-data:
  minio_data:
